name: 'Check PR for SemVer Label'
on:
  pull_request:
    types:
      - labeled
      - unlabeled
      - opened
      - reopened
      - synchronize
    branches:
      - main

permissions:
  pull-requests: read
  contents: read

jobs:
  semver-check:
    name: 'Check PR for SemVer Label'
    if: |
      contains(github.event.pull_request.labels.*.name, 'skip-release') == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Parse the SemVer label
        id: label
        uses: UKHomeOffice/match-label-action@v1
        with:
          labels: minor,major,patch
          mode: singular

      - name: Calculate SemVer value
        id: calculate
        uses: UKHomeOffice/semver-calculate-action@v2
        with:
          increment: ${{ steps.label.outputs.matchedLabels }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Bump from the highest existing tag, not the tag on the PR's base commit,
          # which can be missing or out of date (this caused 1.7.2 -> 1.5.1 and
          # "1.5.3 already exists" on PRs that are behind main).
          default_to_highest: true
